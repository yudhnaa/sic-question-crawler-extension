<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8" />
		<style>
			body {
				width: 300px;
				padding: 15px;
				font-family: Arial, sans-serif;
				font-size: 14px;
			}
			h3 {
				margin: 0 0 15px 0;
				color: #007bff;
				font-size: 16px;
				text-align: center;
			}
			button {
				background: #007bff;
				color: white;
				border: none;
				padding: 8px 16px;
				border-radius: 4px;
				cursor: pointer;
				margin: 5px 0;
				width: 100%;
				font-size: 13px;
			}
			button:hover {
				background: #0056b3;
			}
			button:disabled {
				background: #6c757d;
				cursor: not-allowed;
			}
			#status {
				margin: 10px 0;
				padding: 8px;
				border-radius: 4px;
				font-size: 12px;
				text-align: center;
			}
			.status-info {
				background: #d1ecf1;
				color: #0c5460;
				border: 1px solid #bee5eb;
			}
			.status-success {
				background: #d4edda;
				color: #155724;
				border: 1px solid #c3e6cb;
			}
			.status-error {
				background: #f8d7da;
				color: #721c24;
				border: 1px solid #f5c6cb;
			}
			.question-count {
				text-align: center;
				font-weight: bold;
				color: #28a745;
				margin: 10px 0;
			}
		</style>
	</head>
	<body>
		<h3>🔍 SIC Exercise Crawler</h3>

		<button id="crawl-btn">Crawl Questions</button>
		<button id="export-pdf-btn" disabled>📄 Export PDF</button>
		<button id="test-pdf-btn">🧪 Test PDF</button>

		<div id="status" class="status-info">Ready to crawl questions</div>

		<div class="question-count">
			Found: <span id="question-count">0</span> questions
		</div>

		<script src="popup.js"></script>
	</body>
</html>
